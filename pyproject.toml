[project]
name = "anki-rwkv"
version = "0.1.0"
description = "RWKV training and compression research for Anki"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.1",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "fsrs-optimizer>=6.5.0",
    "lmdb",
    "tomli",
    "tqdm",
    "wandb",
    "psutil",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "utils"]

[tool.setuptools.packages.find]
include = ["rwkv*", "features*"]

[tool.setuptools.package-data]
"rwkv.model" = ["csrc/*.cpp", "csrc/cuda/*.cu", "csrc/cuda/*.h"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

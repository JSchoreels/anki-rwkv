name: Deploy R01 pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "docs/data-quality/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site is pages/ plus the review-relations results, kept at their original URL /docs/data-quality/.
      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp -r pages/. _site/
          cp -r docs/data-quality _site/docs/data-quality
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
